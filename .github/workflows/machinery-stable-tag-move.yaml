# ### fleet-machinery-stable-tag-move
# #### source: fleet
name: Machinery Stable Tag Move

on:
  push:
    branches:
      - main
    paths:
      - registry/machinery-stable.yaml

# The ordinary workflow token can only read repository contents. The distinct
# one-hour A33 installation token is minted inside the protected environment.
permissions:
  contents: read

concurrency:
  group: machinery-stable-tag-move
  cancel-in-progress: false

jobs:
  move-forward:
    if: github.repository == 'AtomiCloud/fleet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: machinery-stable-tag-move
    permissions:
      contents: read
    steps:
      - name: Check out the triggering main commit with the read-only workflow token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: false
          ref: ${{ github.sha }}

      - name: Mint the one-hour A33 installation token inside the protected environment
        id: machinery-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FLEET_MACHINERY_TAG_MOVER_APP_ID }}
          private-key: ${{ secrets.FLEET_MACHINERY_TAG_MOVER_PRIVATE_KEY }}
          owner: AtomiCloud
          repositories: fleet
          permission-contents: write

      - name: Advance only refs/tags/machinery-stable without force
        env:
          GH_TOKEN: ${{ steps.machinery-token.outputs.token }}
        shell: bash
        run: bash ./scripts/local/machinery-stable-tag-move.sh
