# Source: diene-platform/templates/appset.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: canary
  namespace: argocd
  labels:
    helm.sh/chart: diene-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: diene-fleet
    atomi.cloud/platform: "canary"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # g1 — git-files over landscapes/<l>/<svc>.yaml → one primordial Application
    # per row, destined for the Primordial central cluster.
    - git:
        repoURL: https://github.com/AtomiCloud/fleet
        revision: HEAD
        files:
          - path: platforms/canary/landscapes/*/*.yaml
        template:
          metadata:
            name: '{{ .platform }}-{{ .landscape }}-{{ .service }}-primordial'
          spec:
            project: default
            destination:
              server: https://kubernetes.default.svc
              namespace: '{{ .platform }}'
            sources:
              - repoURL: 'oci://registry.atomi.cloud/{{ .platform }}-{{ .service }}-primordial'
                targetRevision: '{{ .pin.tag }}'
                helm:
                  values: '{{ get . "values" | default dict | toRawJson }}'
    # g2 — g1 × cluster generator (label-selected by landscape) → one per-cluster
    # Application per row per matching cluster. This is the SOLE membership
    # mechanism, so delivery: replicated modules land on EVERY landscape cluster.
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/AtomiCloud/fleet
              revision: HEAD
              files:
                - path: platforms/canary/landscapes/*/*.yaml
          - clusters:
              selector:
                matchLabels:
                  atomi.cloud/landscape: '{{ .landscape }}'
                matchExpressions:
                  - key: atomi.cloud/cluster-role
                    operator: NotIn
                    values:
                      - infrastructure-only
        template:
          metadata:
            name: '{{ .platform }}-{{ .landscape }}-{{ .service }}-{{ .name }}'
          spec:
            project: default
            destination:
              server: '{{ .server }}'
              namespace: '{{ .platform }}'
            sources:
              - repoURL: 'oci://registry.atomi.cloud/{{ .platform }}-{{ .service }}'
                targetRevision: '{{ .pin.tag }}'
                helm:
                  values: '{{ get . "values" | default dict | toRawJson }}'
  # Runtime guard for machine-written rows. A malformed row fails generation
  # before either Application is rendered; explicit row fields remain the only
  # identity values consumed downstream.
  templatePatch: |
    {{- $pathLandscape := index .path.segments 3 -}}
    {{- $filenameService := trimSuffix ".yaml" .path.filename -}}
    {{- if ne .platform "canary" -}}
    {{- fail (printf "row platform %q must equal containing roster and release namespace canary" .platform) -}}
    {{- end -}}
    {{- if not (has .service (splitList "," "dummy")) -}}
    {{- fail (printf "row service %q is absent from the containing services roster" .service) -}}
    {{- end -}}
    {{- if ne .service $filenameService -}}
    {{- fail (printf "row service %q must equal filename service %q" .service $filenameService) -}}
    {{- end -}}
    {{- if ne .landscape $pathLandscape -}}
    {{- fail (printf "row landscape %q must equal path landscape %q" .landscape $pathLandscape) -}}
    {{- end -}}
    {}
  # Base template: the two generator-level templates above override per row.
  template:
    metadata:
      name: '{{ .platform }}-row'
      labels:
        atomi.cloud/platform: '{{ .platform }}'
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .platform }}'
      source:
        repoURL: https://github.com/AtomiCloud/fleet
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
