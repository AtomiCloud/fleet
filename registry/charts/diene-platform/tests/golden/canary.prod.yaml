# Source: diene-platform/templates/kargo.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: canary-dummy-ampharos
  namespace: canary
  labels:
    helm.sh/chart: diene-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: diene-fleet
    atomi.cloud/platform: "canary"
    atomi.cloud/landscape: "ampharos"
  annotations:
    atomi.cloud/promotion-gate: "auto"
    atomi.cloud/soak: "15m"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: dummy
      sources:
        # every member takes the PRECEDING step as its upstream; the step after
        # a parallel set therefore lists ALL of that set's members (rendezvous)
        stages:
          - canary-dummy-pikachu
          - canary-dummy-raichu
        # RENDEZVOUS: freight must be available from EVERY member of the
        # preceding parallel set, not just the first to arrive.
        availabilityStrategy: All
        # Residency clock (Kargo's documented soak contract): the interval starts
        # at SUCCESSFUL PROMOTION of the freight into the upstream Stage and runs
        # on occupancy alone. Upstream verification gates downstream availability
        # as an INDEPENDENT condition but never starts, pauses, or resets this
        # interval — freight that clears verification after already occupying the
        # upstream for the required time is immediately soak-eligible.
        requiredSoakTime: "15m"
  verification:
    analysisTemplates:
      - name: "canary-analysis"
  promotionTemplate:
    spec:
      # Fixed git-update promotion template (identical for auto and manual
      # gates). It bumps ONLY the pin in the row file and preserves any
      # human `values:` override block byte-for-byte.
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/AtomiCloud/fleet
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/platforms/canary/landscapes/ampharos/dummy.yaml
            updates:
              - key: pin.tag
                value: ${{ imageFrom("registry.atomi.cloud/canary/dummy").Tag }}
        - uses: git-commit
          config:
            path: ./repo
            author:
              name: kargo-bot
              email: kargo-bot@atomi.cloud
            message: "chore(canary): promote dummy to ampharos"
        - uses: git-push
          config:
            path: ./repo
