# Source: diene-platform/templates/webhook-engine.yaml
apiVersion: fleet.atomi.cloud/v1alpha1
kind: WebhookEngine
metadata:
  # ONE fleet-wide mercury deployment (Q-MT1): the platform declares config
  # only. There is NO engine-version field — the mercury-stable pin rides
  # Kargo on mercury's own service rows, not here.
  name: mercury
  namespace: canary
  labels:
    helm.sh/chart: diene-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: diene-fleet
    atomi.cloud/platform: "canary"
spec:
  home:
    vlandscape: mew
  retention:
    archive:
      bucket: canary-webhook-archive
      store: tigris
    cycle: monthly
    keepMonths: 2
  retryWindow: "72h"
  backoff:
    initial: 5s
    shape: exponential
  circuitBreaker:
    failWindow: 24h
  dedupWindow: "72h"
  quotas:
    burst: 200
    intakeRps: 50
  customDomains:
    []
