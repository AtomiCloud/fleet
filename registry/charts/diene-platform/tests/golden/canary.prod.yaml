# Source: diene-platform/templates/platform-dependency.yaml
apiVersion: fleet.atomi.cloud/v1alpha1
kind: PlatformDependency
metadata:
  name: canary-raichu
  namespace: canary
  labels:
    helm.sh/chart: diene-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: diene-fleet
    atomi.cloud/platform: "canary"
  annotations:
    atomi.cloud/profile: "registered-fleet"
spec:
  platform: canary
  landscape: raichu
  placement:
    preferredHost: raichu
  database:
    maindb:
      backup:
        crossVendor: true
      cpu: 1
      credentialMode: standard
      delivery: external
      engine:
        neon:
          tier: free
      providerAccountRef: canary-neon
      ram: 1Gi
      rotation: "on"
      storage: 10Gi
      type: neon
      version: "16"
  kv:
    sessions:
      credentialMode: standard
      delivery: external
      engine:
        upstash: {}
      providerAccountRef: canary-upstash
      ram: 128Mi
      rotation: "on"
      type: upstash
  cache:
    hot:
      credentialMode: standard
      delivery: replicated
      engine:
        dragonfly: {}
      ram: 128Mi
      rotation: "on"
      type: dragonfly
  store:
    assets:
      credentialMode: standard
      delivery: external
      engine:
        tigris: {}
      providerAccountRef: canary-tigris
      rotation: "on"
      type: tigris
  deletionPolicy:
    retainSecret: 168h
  # render-split summary (compiler assertion surface):
  # externalOffRail: assets,maindb,sessions
  # replicatedOnRail: hot
