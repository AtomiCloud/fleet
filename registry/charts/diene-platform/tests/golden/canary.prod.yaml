# Source: diene-platform/templates/kargo.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: dummy
  namespace: canary
  labels:
    helm.sh/chart: diene-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: diene-fleet
    atomi.cloud/platform: "canary"
spec:
  # Kargo >=1.8 evaluates this native criterion against discovered artifacts
  # before creating Freight. Skewed image/chart revisions therefore never
  # become promotable Freight; mercury uses this same ordinary service rail.
  interval: 5m0s
  freightCreationPolicy: Automatic
  freightCreationCriteria:
    expression: "imageFrom('registry.atomi.cloud/canary/dummy').Tag == chartFrom('oci://registry.atomi.cloud/canary-dummy').Version"
  subscriptions:
    - image:
        repoURL: registry.atomi.cloud/canary/dummy
        imageSelectionStrategy: SemVer
        constraint: ">=0.0.0"
        strictSemvers: true
        discoveryLimit: 5
    - chart:
        repoURL: oci://registry.atomi.cloud/canary-dummy
        semverConstraint: ">=0.0.0"
        discoveryLimit: 5
