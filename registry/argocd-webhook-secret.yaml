# GitHub -> ArgoCD webhook authentication (fleet DoD).
#
# ArgoCD reads the exact key `webhook.github.secret` from its existing
# `argocd-secret`. ESO merges the Infisical-backed value into that Secret; the
# credential never appears in git. GitHub's repository webhook is configured
# with the same value outside this tree.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-webhook
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: diene-fleet
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: /argocd/webhook/webhook.github.secret
